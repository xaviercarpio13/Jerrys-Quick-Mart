<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Jerry's Quick Mart</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Jerry's Quick Mart</h1>
      <div class="customer-toggle">
        <label>
          <input type="radio" name="customer" value="regular" checked /> Regular
        </label>
        <label>
          <input type="radio" name="customer" value="rewards" /> Rewards
        </label>
      </div>
      <div class="cart-info">
        <button id="view-cart">View Cart (<span id="cart-count">0</span>)</button>
      </div>
    </header>

    <main class="container">
      <section id="catalog" class="catalog"></section>
    </main>

    <div id="cart-panel" class="panel hidden">
      <h2>Your Cart</h2>
      <div id="cart-rows"></div>
      <div class="cart-totals">
        <div>Subtotal: $<span id="cart-subtotal">0.00</span></div>
      </div>
      <div class="cart-actions">
        <button id="checkout">Checkout</button>
        <button id="close-cart">Close</button>
      </div>
    </div>

    <div id="receipt-panel" class="panel hidden">
      <h2>Receipt</h2>
      <pre id="receipt-text"></pre>
      <button id="close-receipt">Close</button>
    </div>

    <div id="payment-panel" class="panel hidden">
      <h2>Payment</h2>
      <div>Subtotal: $<span id="pay-subtotal">0.00</span></div>
      <div>Tax: $<span id="pay-tax">0.00</span></div>
      <div>Total: $<span id="pay-total">0.00</span></div>
      <div style="margin-top:12px">
        <label>Cash given: $<input id="cash-given" type="number" step="0.01" min="0" /></label>
      </div>
      <div style="margin-top:12px">Change: $<span id="pay-change">0.00</span></div>
      <div class="cart-actions">
        <button id="pay-now">Pay</button>
        <button id="cancel-pay">Cancel</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
